[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Krome_to_despotic"
version = "0.0.1"
dependencies = [
  "numpy>=1.22.4, <1.26.4",
  "pexpect>=4.9.0",
  "scipy>=1.13.1"]
requires-python = ">=3.12"
authors = [
  {name = "Eloy van de Genugten"}, {email = "genugten@strw.leidenuniv.nl"},
]
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
Krome_to_despotic = ["info_fillout.log"]
