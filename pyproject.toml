[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Krome_to_despotic"
version = "0.0.1"
dependencies = [
  "numpy>=1.22.4, <1.26.4",
  "pexpect>=4.9.0",
  "scipy>=1.13.1",
  "astropy>=6.1.2"]
requires-python = ">=3.10"
authors = [
  {name = "Eloy van de Genugten"}, {email = "genugten@strw.leidenuniv.nl"},
  {name = "Piyush Sharda"}, {email = "sharda@strw.leidenuniv.nl"}
]
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

